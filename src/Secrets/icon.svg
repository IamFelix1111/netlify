<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Secrets icon: brass padlock on a dark tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4150"/>
      <stop offset="1" stop-color="#232833"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD469"/>
      <stop offset="0.55" stop-color="#F0B23E"/>
      <stop offset="1" stop-color="#C8891B"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B94A8"/>
      <stop offset="1" stop-color="#5A6377"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="8"/>

  <!-- shackle -->
  <path d="M176 232 v-56 a80 80 0 0 1 160 0 v56" fill="none" stroke="url(#steel)" stroke-width="36" stroke-linecap="round"/>

  <!-- body -->
  <rect x="136" y="216" width="240" height="196" rx="36" fill="url(#brass)"/>
  <path d="M136 268 L376 216 L376 266 L136 318 Z" fill="#FFFFFF" opacity="0.18"/>

  <!-- keyhole -->
  <circle cx="256" cy="296" r="26" fill="#232833"/>
  <rect x="246" y="310" width="20" height="48" rx="10" fill="#232833"/>
</svg>
